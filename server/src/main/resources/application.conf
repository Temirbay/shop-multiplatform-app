ktor {
    deployment {
        port = 8080
        # Переопределяется переменной окружения — пригодится при деплое
        port = ${?PORT}
    }
    application {
        modules = [ kz.mtemirbay.shop.ApplicationKt.module ]
    }
}

jwt {
    # Секрет подписи токенов. В git — только для разработки; на настоящем сервере задаётся переменной JWT_SECRET
    secret = "dev-only-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "shop-server"
    audience = "shop-app"
    validityDays = 30
}

database {
    # Файл БД: server/data/shop.mv.db (путь относительно папки, из которой запущен сервер)
    url = "jdbc:h2:file:./data/shop"
    url = ${?DATABASE_URL}
}
